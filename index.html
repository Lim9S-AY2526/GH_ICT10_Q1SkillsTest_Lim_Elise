<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skillstest</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#ffe6f2; font-family:Arial;">

<div style="max-width:700px; margin:auto; margin-top:40px; padding:25px;
            background:white; border-radius:20px; box-shadow:0 0 15px #ffb6d9;">

    <h1 style="text-align:center; color:#d63384;">🌸 Sweets and Fries 🌸</h1>
    <p style="text-align:center; color:#555;">Select your items below</p>

    <div style="font-size:18px; color:#444;">

        <!-- ITEM 1 -->
        <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px;">
            <img src="https://zhangcatherine.com/wp-content/uploads/2026/03/Dubai-chewy-cookie-1.jpg"
                 style="width:80px; height:80px; border-radius:10px;">
            <label><input type="checkbox" id="item1" value="150"> Dubai Chewy Cookie: ₱150</label>
        </div>

        <!-- ITEM 2 -->
        <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px;">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQB2S1zjm938jj-QaAD7vUr8oi0J4rTttcnsDz2UA2PtjSZ_Xct5Mq5wdw&s=10"
                 style="width:80px; height:80px; border-radius:10px;">
            <label><input type="checkbox" id="item2" value="120"> Banana Bread: ₱120</label>
        </div>

        <!-- ITEM 3 -->
        <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px;">
            <img src="https://sallysbakingaddiction.com/wp-content/uploads/2013/05/classic-chocolate-chip-cookies.jpg"
                 style="width:80px; height:80px; border-radius:10px;">
            <label><input type="checkbox" id="item3" value="100"> Chocolate Chip Cookies: ₱100</label>
        </div>

        <!-- ITEM 4 -->
        <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px;">
            <img src="https://detoxinista.com/wp-content/uploads/2021/03/best-homemade-fries.jpg"
                 style="width:80px; height:80px; border-radius:10px;">
            <label><input type="checkbox" id="item4" value="60"> Fries: ₱60</label>
        </div>

        <button py-click="create_order"
                style="background-color:#d63384; color:white; padding:10px 20px;
                       border:none; border-radius:10px; font-size:18px;">
            Create Order
        </button>

    </div>

    <div id="Receipt" style="margin-top:25px;"></div>

</div>

<py-script src="main.py"></py-script>

</body>
</html>
